[project]
name = "proyecto-2"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astral>=3.2",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "openai>=3.49.0",
    "openpyxl>=3.1.5",
    "pandas==2.2.3",
    "python-dotenv>=1.2.4",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integracion: pruebas de integración con APIs simuladas",
]
